name: Build RSS feeds

on:
  schedule:
    # Hourly at :25. GitHub delays or drops scheduled runs often, so a denser
    # cadence bounds how long a new chapter waits for a deploy.
    - cron: "25 * * * *"
    # Start before the release window: 08:45 CEST / 07:45 CET. The watch job
    # waits for 08:50-11:05 Europe/Berlin itself, so scheduler drift does not
    # make the build late.
    - cron: "45 6 * * *"
  workflow_dispatch:
    inputs:
      watch:
        description: "Run the release watcher instead of a build"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - pawchive_feed.py
      - patreon_watch.py
      - royalroad_feed.py
      - epublibre_feed.py
      - rss_common.py
      - requirements.txt
      - .github/workflows/build-feeds.yml

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  watch:
    # Daily pre-window run, or a manual watcher test; every other trigger
    # goes straight to build.
    if: (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.watch)
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.poll.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Watch for the new chapter
        id: poll
        env:
          PAWCHIVE_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
        run: python patreon_watch.py

  build:
    needs: [watch]
    # Build on every trigger except a watch run that found nothing. A failed
    # watch falls through to a normal build instead of dropping the day.
    if: always() && (needs.watch.result != 'success' || needs.watch.outputs.found == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build feeds
        id: feeds
        env:
          PAWCHIVE_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
          PAWCHIVE_SESSION: "${{ secrets.PAWCHIVE_SESSION }}"
          PATREON_COOKIE: "${{ secrets.PATREON_COOKIE }}"
        run: python pawchive_feed.py
      - name: Build Royal Road feeds
        env:
          ROYALROAD_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
        run: python royalroad_feed.py
      - name: Build ePubLibre feed
        continue-on-error: true
        env:
          EPUBLIBRE_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
        run: python epublibre_feed.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      # deploy-pages@v5 still bundles a dependency that imports Node's removed
      # punycode API (actions/deploy-pages#434). Suppress that action-internal
      # deprecation until upstream publishes a fixed release.
      - uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation
      # The feed falls back to Pawchive when the cookie dies, so surface the
      # failure as an issue instead of leaving a green run that looks healthy.
      - name: Report rejected Patreon cookie
        if: steps.feeds.outputs.patreon_auth == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search '"Patreon cookie" in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Patreon cookie issue #$existing is already open"
            exit 0
          fi
          gh issue create \
            --title "Patreon cookie expired or missing" \
            --body "The feed build could not authenticate with Patreon, so chapters are falling back to Pawchive (about three hours late). Set the \`PATREON_COOKIE\` secret to the \`session_id\` value from a logged-in Patreon browser session."
      - name: Close resolved Patreon cookie issue
        if: steps.feeds.outputs.patreon_auth == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --state open --search '"Patreon cookie" in:title' --json number --jq '.[].number'); do
            gh issue close "$number" --comment "PATREON_COOKIE authenticated again; direct publishing restored."
          done
