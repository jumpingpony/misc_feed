name: Build RSS feeds

on:
  schedule:
    # Hourly at :25. GitHub delays or drops scheduled runs often, so a denser
    # cadence bounds how long a new chapter waits for a deploy.
    - cron: "25 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pawchive_feed.py
      - epublibre_feed.py
      - rss_common.py
      - requirements.txt
      - .github/workflows/build-feeds.yml

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build feeds
        env:
          PAWCHIVE_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
          PAWCHIVE_SESSION: "${{ secrets.PAWCHIVE_SESSION }}"
        run: python pawchive_feed.py
      - name: Build ePubLibre feed
        continue-on-error: true
        env:
          EPUBLIBRE_SITE_BASE_URL: "${{ steps.pages.outputs.base_url }}"
        run: python epublibre_feed.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages makes a single, unretried list-artifacts call, so a run that
      # reaches it before the upload is visible in the artifacts API fails with
      # "No artifacts named github-pages were found". Its own job gives some lag;
      # poll to make the handoff deterministic.
      - name: Wait for pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                 --jq '.artifacts[].name' | grep -qx 'github-pages'; then
              echo "pages artifact visible after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::pages artifact never became visible"
          exit 1
      # deploy-pages@v5 still bundles a dependency that imports Node's removed
      # punycode API (actions/deploy-pages#434). Suppress that action-internal
      # deprecation until upstream publishes a fixed release.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --no-deprecation
